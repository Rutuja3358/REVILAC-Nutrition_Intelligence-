<!doctype html><html><head><meta charset="utf-8"><title>REVILAC browser smoke test</title></head><body><h1>REVILAC browser smoke test</h1><pre id="out">RUNNING</pre><iframe id="app" src="index.html" style="width:1200px;height:800px"></iframe><script>
(async()=>{const out=document.getElementById('out'),results=[];const add=(n,ok,d='')=>results.push({test:n,status:ok?'PASS':'FAIL',detail:d});try{const f=document.getElementById('app');await new Promise((res,rej)=>{f.onload=res;setTimeout(()=>rej(Error('iframe load timeout')),12000)});const w=f.contentWindow,d=f.contentDocument;add('App document loads',!!d.querySelector('body'));add('Eight-pillar workbench section exists',!!d.querySelector('#p26SafetyChecks')&&!!d.querySelector('#p26PlanBuild'));const run=d.querySelector('#p26RunTests');if(run){run.click();add('Built-in test button produces results',d.querySelector('#p26TestsOut').textContent.includes('PASS')||d.querySelector('#p26TestsOut').textContent.includes('FAIL'),d.querySelector('#p26TestsOut').textContent.slice(0,300));}else add('Built-in test button exists',false);const check=d.querySelector('#p26SafetyChecks input');if(check){check.checked=true;check.dispatchEvent(new w.Event('change',{bubbles:true}));d.querySelector('#p26PlanBuild').click();add('Safety flag blocks meal-plan generation',d.querySelector('#p26PlanOut').textContent.includes('SAFETY HOLD'),d.querySelector('#p26PlanOut').textContent.slice(0,220));}else add('Safety check control exists',false);if(check)check.checked=false;d.querySelector('#p26PlanBuild').click();add('No-risk sample plan renders',d.querySelector('#p26PlanOut').textContent.includes('Breakfast')||d.querySelector('#p26PlanOut').textContent.includes('Limitations'),d.querySelector('#p26PlanOut').textContent.slice(0,220));const exp=d.querySelector('#p26Export');add('JSON export control exists',!!exp); }catch(e){add('Browser harness execution',false,String(e));}out.textContent=JSON.stringify({results,summary:{passed:results.filter(x=>x.status==='PASS').length,failed:results.filter(x=>x.status==='FAIL').length}},null,2);})();
</script></body></html>
